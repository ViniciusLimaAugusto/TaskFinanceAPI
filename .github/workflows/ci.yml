name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TaskFinanceAPI.sln
      - run: dotnet build TaskFinanceAPI.sln --configuration Release --no-restore
      - name: Test using SQLite
        run: dotnet test TaskFinanceAPI.sln --configuration Release --no-build
      - name: Test using SQL Server
        shell: bash
        run: |
          export MSSQL_SA_PASSWORD="Aa1!$(openssl rand -hex 24)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          sql=$(docker run --detach --rm -p 127.0.0.1:11433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server@sha256:e10cd49443c94dbdcb7a050987db22ff4d8c87052ac53768abe1ed848d3fcef6)
          trap 'docker stop "$sql" >/dev/null' EXIT
          ready() {
            docker exec "$sql" bash -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 2 -b -Q "SELECT 1"' >/dev/null 2>&1
          }
          for attempt in {1..45}; do
            if ready; then break; fi
            sleep 2
          done
          if ! ready; then
            docker logs --tail 50 "$sql"
            exit 1
          fi
          export TASKFINANCE_TEST_SQLSERVER="Server=127.0.0.1,11433;User ID=sa;Password=$MSSQL_SA_PASSWORD;Encrypt=True;TrustServerCertificate=True"
          dotnet test TaskFinanceAPI.sln --configuration Release --no-build
      - name: Build Docker image
        run: docker build --tag taskfinance-api:ci .
