x-api-environment: &api-environment
  ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=TaskFinance;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"

services:
  sql:
    image: mcr.microsoft.com/mssql/server@sha256:e10cd49443c94dbdcb7a050987db22ff4d8c87052ac53768abe1ed848d3fcef6
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  migrate:
    image: taskfinance-api:local
    build: .
    entrypoint: ["/app/efbundle"]
    environment: *api-environment
    depends_on:
      sql:
        condition: service_healthy
  api:
    image: taskfinance-api:local
    build: .
    environment: *api-environment
    ports:
      - "127.0.0.1:5010:8080"
    depends_on:
      sql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r version status rest <&3; test \"$$status\" = 200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sql-data:
